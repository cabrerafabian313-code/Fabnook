<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabnook</title>
<style>
  body { font-family: system-ui; background: #0f0f12; color: #fff; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #ff6b9d; }
  .card { background: #1a1a1f; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  textarea, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 10px; }
  button { background: #ff6b9d; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; }
  .poema { background: #1a1a1f; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
  .autor { color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<h1>📖 Fabnook</h1>

<div class="card">
  <h3>Publica tu poema</h3>
  <input type="text" id="autor" placeholder="Tu nombre">
  <textarea id="poema" rows="4" placeholder="Escribe tu poema aquí..."></textarea>
  <button onclick="publicar()">Publicar</button>
</div>

<h2>Poemas de todos</h2>
<div id="lista"></div>

<script type="module">
  // TU CÓDIGO DE FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHTZ22pIQ9ZnDjnuRlz9b1lV8x5CDjSWM",
    authDomain: "fabnook-33280.firebaseapp.com",
    projectId: "fabnook-33280",
    storageBucket: "fabnook-33280.firebasestorage.app",
    messagingSenderId: "246588732930",
    appId: "1:246588732930:web:c8f2dc4daad720015a191b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // PUBLICAR POEMA
  window.publicar = async function() {
    const autor = document.getElementById('autor').value || "Anónimo";
    const texto = document.getElementById('poema').value;
    if(texto.trim() === "") return alert("Escribe un poema primero");
    
    await addDoc(collection(db, "poemas"), {
      autor: autor,
      texto: texto,
      fecha: serverTimestamp()
    });
    
    document.getElementById('poema').value = "";
  }

  // MOSTRAR POEMAS EN TIEMPO REAL
  const q = query(collection(db, "poemas"), orderBy("fecha", "desc"));
  onSnapshot(q, (snapshot) => {
    const lista = document.getElementById('lista');
    lista.innerHTML = "";
    snapshot.forEach((doc) => {
      const p = doc.data();
      lista.innerHTML += `
        <div class="poema">
          <div class="autor">Por: ${p.autor}</div>
          <div>${p.texto}</div>
        </div>
      `;
    });
  });
</script>

</body>
    </html>
