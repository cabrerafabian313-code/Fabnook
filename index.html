<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabnook</title>
<style>
:root{--bg:#0A0A0F;--surface:#14141A;--surface2:#1E1E28;--text:#F5F5F7;--muted:#8A8A9E;--gold:#C9A961;--border:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text)}
.screen{display:none;min-height:100vh;padding-bottom:100px}
.screen.active{display:block}
.container{max-width:600px;margin:auto;padding:20px}
.btn{width:100%;padding:16px;border-radius:14px;font-weight:600;margin-bottom:12px;border:none}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-outline{border:1px solid var(--border);background:transparent;color:var(--text)}
.input{background:var(--surface);border:1px solid var(--border);padding:16px;border-radius:14px;width:100%;color:var(--text);margin-bottom:15px}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px}
.bottom-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border-radius:30px;padding:8px;display:flex;gap:5px;border:1px solid var(--border)}
.nav-item{padding:12px 18px;border-radius:25px;color:var(--muted);background:none}
.nav-item.active{background:var(--bg);color:var(--text)}
.nav-center{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;border:none}
.poem-card{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:15px;border:1px solid var(--border)}
.categories{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.cat-btn{padding:10px 18px;border-radius:30px;background:var(--surface);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.cat-btn.active{background:var(--gold);color:var(--bg)}
.reader{min-height:100vh;background:linear-gradient(rgba(0,0,0,.6),#0A0A0F),url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80') center/cover;padding:30px}
.comment{display:flex;gap:12px;margin-bottom:15px}
.avatar-sm{width:40px;height:40px;border-radius:50%;background:var(--gold)}
</style>
</head>
<body>

<!-- 1 BIENVENIDA -->
<div id="welcome" class="screen active">
    <div style="text-align:center;padding-top:120px">
        <div style="font-size:90px">🪶</div><h1 style="font-size:40px;font-weight:300">Fabnook</h1>
        <p style="color:var(--muted);margin:15px 0 40px">Donde las palabras encuentran un lugar.</p>
        <div class="container">
            <button class="btn btn-primary" onclick="show('signup')">Crear cuenta</button>
            <button class="btn btn-outline" onclick="show('login')">Iniciar sesión</button>
            <button class="btn" style="background:none;color:var(--muted)" onclick="guest()">Continuar como invitado</button>
        </div>
    </div>
</div>

<!-- 2 CREAR CUENTA -->
<div id="signup" class="screen">
    <div class="header"><button onclick="show('welcome')">←</button><h2>Crear cuenta</h2><div></div></div>
    <div class="container">
        <input id="suName" class="input" placeholder="Nombre de usuario">
        <input id="suEmail" class="input" type="email" placeholder="Correo electrónico">
        <input id="suPass" class="input" type="password" placeholder="Contraseña">
        <input id="suDate" class="input" type="date">
        <button class="btn btn-primary" onclick="signUp()">Crear mi cuenta</button>
        <p style="text-align:center;margin-top:20px;color:var(--muted)" onclick="show('login')">¿Ya tienes cuenta? Inicia sesión</p>
    </div>
</div>

<!-- 3 INICIO -->
<div id="home" class="screen">
    <div class="container">
        <div style="padding:20px 0"><h2>¡Hola, <span id="userName">Invitado</span>! 👋</h2><p style="color:var(--muted)">¿Qué quieres leer hoy?</p></div>
        <div class="categories">
            <button class="cat-btn active">❤️ Amor</button><button class="cat-btn">😢 Tristeza</button><button class="cat-btn">✨ Motivación</button>
        </div>
        <h3 style="margin:20px 0">Recomendados para ti</h3>
        <div id="poemsGrid"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active">🏠</button><button class="nav-item" onclick="show('explore')">🔍</button>
        <button class="nav-center" onclick="show('create')">+</button><button class="nav-item" onclick="show('library')">📚</button><button class="nav-item" onclick="show('profile')">👤</button>
    </div>
</div>

<!-- 4 EXPLORAR -->
<div id="explore" class="screen">
    <div class="container">
        <input id="search" class="input" placeholder="🔍 Buscar poemas, autores o libros..." oninput="loadPoems()">
        <div id="exploreGrid"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item" onclick="show('home')">🏠</button><button class="nav-item active">🔍</button>
        <button class="nav-center" onclick="show('create')">+</button><button class="nav-item" onclick="show('library')">📚</button><button class="nav-item" onclick="show('profile')">👤</button>
    </div>
</div>

<!-- 5 LECTOR -->
<div id="reader" class="screen">
    <div class="reader">
        <div class="header"><button onclick="show('home')">←</button><button>Aa</button></div>
        <h2 id="rTitle"></h2><p style="color:var(--muted)" id="rAuthor"></p>
        <p id="rContent" style="line-height:2;margin-top:30px;white-space:pre-line"></p>
        <div style="display:flex;justify-content:space-around;margin-top:40px">
            <button onclick="likePoem()">♥ <span id="rLikes">0</span></button>
            <button onclick="show('comments')">💬 <span id="rComments">0</span></button>
            <button>🔖</button><button>📤</button>
        </div>
    </div>
</div>

<!-- 6 CREAR POEMA -->
<div id="create" class="screen">
    <div class="header"><button onclick="show('home')">×</button><h2>Nuevo poema</h2><button style="color:var(--gold)" onclick="publish()">Publicar</button></div>
    <div class="container">
        <input id="pTitle" class="input" placeholder="Título del poema">
        <textarea id="pContent" class="input" style="min-height:400px" placeholder="Escribe tu poema..."></textarea>
    </div>
</div>

<!-- 9 BIBLIOTECA -->
<div id="library" class="screen">
    <div class="container">
        <h2>Mi biblioteca</h2>
        <div style="display:flex;gap:10px;margin:20px 0">
            <button class="cat-btn active">Publicados</button><button class="cat-btn">Borradores</button><button class="cat-btn">Favoritos</button>
        </div>
        <div id="myPoems"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item" onclick="show('home')">🏠</button><button class="nav-item" onclick="show('explore')">🔍</button>
        <button class="nav-center" onclick="show('create')">+</button><button class="nav-item active">📚</button><button class="nav-item" onclick="show('profile')">👤</button>
    </div>
</div>

<!-- 10 PERFIL -->
<div id="profile" class="screen">
    <div class="container">
        <div style="text-align:center;padding:30px 0">
            <div style="width:100px;height:100px;border-radius:50%;background:var(--gold);margin:auto"></div>
            <h2 id="pName">Fabián</h2><p style="color:var(--muted)">Escritor</p>
        </div>
        <div style="display:flex;justify-content:space-around;text-align:center">
            <div><strong id="pBooks">0</strong><br><small>Libros</small></div>
            <div><strong id="pPoems">0</strong><br><small>Poemas</small></div>
            <div><strong>1.2K</strong><br><small>Me gusta</small></div>
        </div>
        <button class="btn btn-outline" style="margin-top:30px" onclick="logout()">Cerrar sesión</button>
    </div>
    <div class="bottom-nav">
        <button class="nav-item" onclick="show('home')">🏠</button><button class="nav-item" onclick="show('explore')">🔍</button>
        <button class="nav-center" onclick="show('create')">+</button><button class="nav-item" onclick="show('library')">📚</button><button class="nav-item active">👤</button>
    </div>
</div>

<!-- 11 COMENTARIOS -->
<div id="comments" class="screen">
    <div class="header"><button onclick="show('reader')">←</button><h2>Comentarios</h2><div></div></div>
    <div class="container" id="commentsList"></div>
    <div style="position:fixed;bottom:0;width:100%;padding:15px;background:var(--surface2);display:flex;gap:10px">
        <input id="newComment" class="input" placeholder="Escribe un comentario..." style="margin:0">
        <button onclick="addComment()" style="background:var(--gold);color:var(--bg);border-radius:50%;width:50px">➤</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, increment, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHTZ22pIQ9ZnDjnuRlz9b1lV8x5CDjSWM",
  authDomain: "fabnook-33280.firebaseapp.com",
  projectId: "fabnook-33280",
  storageBucket: "fabnook-33280.firebasestorage.app",
  messagingSenderId: "246588732930",
  appId: "1:246588732930:web:c8f2dc4daad720015a191b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let poems = []; let currentPoem = null; let user = null;

const show = id => {document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')};
const guest = () => {user=null;document.getElementById('userName').textContent='Invitado';show('home')};

async function signUp(){
    const {user:u} = await createUserWithEmailAndPassword(auth,suEmail.value,suPass.value);
    await updateProfile(u,{displayName:suName.value});
    user=u;document.getElementById('userName').textContent=u.displayName;show('home');
}
async function login(){/* puedes agregarlo igual */}
async function logout(){await signOut(auth);show('welcome')}

async function publish(){
    if(!auth.currentUser) return alert('Inicia sesión');
    await addDoc(collection(db,"poemas"),{
        title:pTitle.value,content:pContent.value,author:auth.currentUser.displayName,uid:auth.currentUser.uid,
        likes:0,comments:0,date:Date.now()
    });
    pTitle.value='';pContent.value='';show('home');
}

const q = query(collection(db,"poemas"),orderBy("date","desc"));
onSnapshot(q,snap=>{poems=[];snap.forEach(d=>poems.push({id:d.id,...d.data()}));render()});

function render(){
    poemsGrid.innerHTML=poems.slice(0,6).map(p=>card(p)).join('');
    exploreGrid.innerHTML=poems.filter(p=>p.title.toLowerCase().includes(search.value.toLowerCase())).map(p=>card(p)).join('');
    if(user){myPoems.innerHTML=poems.filter(p=>p.uid===user.uid).map(p=>card(p)).join('');pPoems.textContent=poems.filter(p=>p.uid===user.uid).length}
}

function card(p){
    return `<div class="poem-card" onclick="openR('${p.id}')"><h4>${p.title}</h4><small>${p.author}</small><div style="margin-top:10px;color:var(--muted)">♥ ${p.likes} 💬 ${p.comments}</div></div>`
}

function openR(id){currentPoem=poems.find(p=>p.id===id);rTitle.textContent=currentPoem.title;rAuthor.textContent=currentPoem.author;rContent.textContent=currentPoem.content;rLikes.textContent=currentPoem.likes;rComments.textContent=currentPoem.comments;show('reader')}

async function likePoem(){await updateDoc(doc(db,"poemas",currentPoem.id),{likes:increment(1)})}
async function addComment(){
    if(!newComment.value) return;
    await addDoc(collection(db,"comentarios"),{poemId:currentPoem.id,text:newComment.value,author:auth.currentUser.displayName});
    await updateDoc(doc(db,"poemas",currentPoem.id),{comments:increment(1)});
    newComment.value='';
}

onAuthStateChanged(auth,u=>{if(u){user=u;document.getElementById('userName').textContent=u.displayName;document.getElementById('pName').textContent=u.displayName;show('home')}});

window.show=show;window.signUp=signUp;window.publish=publish;window.openR=openR;window.likePoem=likePoem;window.addComment=addComment;window.logout=logout;window.guest=guest;
</script>
</body>
  </html>
